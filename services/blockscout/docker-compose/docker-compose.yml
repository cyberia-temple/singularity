version: '3.9'

# Log rotation, applied to every service below.
#
# 2026-09-13: the host filled to 100% and the chain stopped sealing for two
# hours. One container — polygon-edge — held a 48 GB json log, because Docker's
# json-file driver keeps every byte forever unless it is told not to, and
# nothing here told it. Only `backend` had ever carried a `logging:` block.
#
# Two caps rather than one because the volumes differ by two orders of
# magnitude: polygon-edge prints ~9 INFO lines per block at one block per
# second (~215 MB/day), everything else prints on an event.
x-logging: &logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "3"
    compress: "true"

# The sealing node. 50m x 3 holds roughly 16 hours of block history, which is
# what a post-mortem needs; INFO stays on because those lines are the only
# human-readable proof the chain is still producing.
x-logging-node: &logging-node
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "3"
    compress: "true"

services:
  redis-db:
    logging: *logging
    extends:
      file: ./services/redis.yml
      service: redis-db

  db-init:
    logging: *logging
    extends:
      file: ./services/db.yml
      service: db-init

  db:
    logging: *logging
    depends_on:
      db-init:
        condition: service_completed_successfully
    extends:
      file: ./services/db.yml
      service: db

  backend:
    logging: *logging
    depends_on:
      - db
      - redis-db
    extends:
      file: ./services/backend.yml
      service: backend
    image: ghcr.io/blockscout/blockscout:11.0.0
    links:
      - db:database
    environment:
        ETHEREUM_JSONRPC_HTTP_URL: http://host.docker.internal:8545/
        ETHEREUM_JSONRPC_TRACE_URL: http://host.docker.internal:8545/
        ETHEREUM_JSONRPC_WS_URL: ws://host.docker.internal:8545/
        CHAIN_ID: '49406'
        # 2026-11-03: this fetcher was most of the host's load. polygon-edge
        # answers debug_traceTransaction on a reverted or out-of-gas
        # transaction with an error instead of a trace, so the same 416
        # blocks failed forever: ~87 rejected traces a second, backend at
        # 150% CPU, the node and the docker-proxy on :8545 another core
        # between them, load 10 on 4 cores and a 4-5 s site whenever anything
        # spiked. Internal transactions already indexed stay; new ones are
        # not fetched until a node can trace a revert.
        INDEXER_DISABLE_INTERNAL_TRANSACTIONS_FETCHER: 'true'

  # nft_media_handler: removed 2026-08-22.
  #
  # It never started once. It needs NFT_MEDIA_HANDLER_NODES_MAP, which was
  # never set, and object storage for the thumbnails, which was never
  # provisioned (every NFT_MEDIA_HANDLER_AWS_* is still commented out in
  # envs/common-blockscout.env). So it crashed on boot and `restart: always`
  # started it again, 4,710 times, each one a fresh BEAM VM burning ~85% of a
  # core on a four-core host.
  #
  # Nothing depended on it: the explorer's NFT pages and the wallet's NFT tab
  # read image URLs straight from the v2 API, and thumbnails were the only
  # thing this produced. Bringing it back means provisioning a bucket first,
  # then NFT_MEDIA_HANDLER_NODES_MAP, and only then this service.

  visualizer:
    logging: *logging
    extends:
      file: ./services/visualizer.yml
      service: visualizer

  sig-provider:
    logging: *logging
    extends:
      file: ./services/sig-provider.yml
      service: sig-provider

  frontend:
    logging: *logging
    depends_on:
      - backend
    extends:
      file: ./services/frontend.yml
      service: frontend

  stats-db-init:
    logging: *logging
    extends:
      file: ./services/stats.yml
      service: stats-db-init

  stats-db:
    logging: *logging
    depends_on:
      stats-db-init:
        condition: service_completed_successfully
    extends:
      file: ./services/stats.yml
      service: stats-db

  stats:
    logging: *logging
    depends_on:
      - stats-db
      - backend
    extends:
      file: ./services/stats.yml
      service: stats

  # user-ops-indexer: removed 2026-08-22.
  #
  # An ERC-4337 indexer on a chain with no account abstraction. eth_getCode on
  # the canonical v0.6 EntryPoint (0x5ff137d4b0fdcd49dca30c7cf57e578a026d2789)
  # returns 0x on Cyberia — the contract is not deployed, so there has never
  # been a user operation to index.
  #
  # It could not have connected even if there were. It wants a WebSocket
  # (ws://host.docker.internal:8545/) and polygon-edge answers the upgrade with
  # a plain 200 instead of 101, which is the literal text of its crash:
  # `Error: HTTP error: 200 OK`. 1,088 restarts.

  proxy:
    logging: *logging
    depends_on:
      - backend
      - frontend
      - stats
    extends:
      file: ./services/nginx.yml
      service: proxy

  certbot:
    logging: *logging
    image: certbot/certbot
    volumes:
      - /root/certbot/conf:/etc/letsencrypt
      - /root/certbot/www:/var/www/certbot

  cyberia_church:
    logging: *logging
    build: /root/singularity/backend/laravel
    container_name: cyberia_church
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - /root/singularity/backend/laravel:/var/www/html
      - /root/singularity:/singularity
      - /root/.config/solana:/solana
    # The symlink step is deliberately not allowed to fail the boot. On
    # 2026-09-13 `storage:link --relative` died on a missing symfony/filesystem
    # (it is a *suggestion* of illuminate/filesystem, and was in no lock file),
    # the container crash-looped, and the whole site answered 502 — over a
    # symlink. A missing link costs uploaded files; it must not cost the site.
    # The dependency is in composer.json now; this keeps the blast radius small
    # the next time something in that line breaks.
    command: >
      sh -lc "if [ ! -f vendor/autoload.php ]; then
        composer install --no-interaction --prefer-dist --no-progress;
      fi &&
      php artisan storage:link --relative --force || true;
      php artisan serve --host=0.0.0.0 --port=9001"
    ports:
      # Loopback only: the proxy reaches this container over the docker network,
      # and `php artisan serve` must never face the internet directly.
      - "127.0.0.1:9001:9001"
    env_file:
      - /root/singularity/backend/laravel/.env
    # Two networks, and the second one exists for a single link. The bridge's
    # Monero wallet (services/monero) is a HOT wallet: whoever reaches its RPC
    # and holds its login can spend it. Putting it on the network above would
    # hand that reach to the explorer front end, IPFS, the proxy and every
    # other container here, so it gets a network with exactly two members
    # instead — this app and that wallet.
    #
    # Declared here rather than in services/monero, and not `external`, so the
    # site still starts on a host that has never run the monero stack. The
    # dependency only points one way: the wallet joins this network, the site
    # never waits for it.
    networks:
      - default
      - bridge_monero

  polygon-edge:
    logging: *logging-node
    image: 0xpolygon/polygon-edge:latest
    container_name: polygon-edge
    restart: unless-stopped
    user: "0:0"
    volumes:
      - /root/polygon-edge-validators:/data
      - /root/id/docker/polygon-edge/genesis.json:/genesis.json:ro
    ports:
      - "8545:8545"
      - "8546:8546"
      - "1337:1337"
    environment:
      - POLYGON_EDGE_DATA_DIR=/data
    command: >
      server
      --data-dir=/data
      --chain=/genesis.json
      --jsonrpc=0.0.0.0:8545
      --access-control-allow-origins=*
      --json-rpc-block-range-limit=1000
      --block-gas-target=0x1C9C380
      --libp2p=0.0.0.0:1337
      --seal
      --price-limit=1000000000

  ipfs:
    logging: *logging
    image: ipfs/kubo:latest
    container_name: ipfs
    restart: unless-stopped
    environment:
      # Disable mDNS/local discovery — appropriate for a datacenter node.
      - IPFS_PROFILE=server
    volumes:
      - ipfs-data:/data/ipfs
      # Kubo runs scripts in /container-init.d/ once, after `ipfs init`,
      # before the daemon starts. Used here to open the API to siblings.
      - ./ipfs/001-bind-api.sh:/container-init.d/001-bind-api.sh:ro
    ports:
      # libp2p swarm — peer connectivity, must be reachable for content to
      # propagate to public gateways (e.g. ipfs.io).
      - "4001:4001"
      - "4001:4001/udp"
      # Kubo API (pinning). Bound to localhost on the host so it is NOT exposed
      # publicly; sibling containers reach it in-network at http://ipfs:5001.
      - "127.0.0.1:5001:5001"
      # Read gateway, localhost only — handy for debugging pinned content.
      # Host port 8080 is taken by the Blockscout proxy (services/nginx.yml),
      # so it is published on 8881 here; the container still serves on 8080.
      # NOTE: 8881 is host-only. Sibling containers reach the gateway at
      # http://ipfs:8080 and the API (for pinning) at http://ipfs:5001.
      - "127.0.0.1:8881:8080"

volumes:
  ipfs-data:

networks:
  # Named explicitly because another compose project joins it by name; see
  # cyberia_church above for why it exists at all.
  bridge_monero:
    name: cyberia-bridge-monero
