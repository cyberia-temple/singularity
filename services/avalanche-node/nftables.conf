#!/usr/sbin/nft -f
# Only SSH and Avalanche p2p (staking port) are reachable from outside.
# The node's HTTP API (9650) listens on 127.0.0.1 and is never exposed directly.
flush ruleset

table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;
    iif "lo" accept
    ct state established,related accept
    ct state invalid drop
    meta l4proto { icmp, ipv6-icmp } accept
    tcp dport 22 accept
    tcp dport 9651 accept
  }
  chain forward {
    type filter hook forward priority filter; policy drop;
  }
  chain output {
    type filter hook output priority filter; policy accept;
  }
}
