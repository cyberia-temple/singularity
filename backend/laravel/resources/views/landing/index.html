<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#ffffff;
    --ink:#0a0a0a;
    --ink-2:#202327;
    --muted:#6b7075;
    --rule:#e9ebee;
    --cyan:#00e5d1;          /* primary accent */
    --cyan-strong:#00c8b8;
    --magenta:#ff2bd6;       /* glitch shadow */
    --max:1180px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Manrope',ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  /* clip (not hidden): kills sideways scroll from glitch trails without
     creating a scroll container, so position:sticky on the nav keeps working */
  html,body{overflow-x:clip}
  a{color:inherit;text-decoration:none}
  img{display:block;max-width:100%}
  ::selection{background:var(--cyan);color:#000}

  /* ====== NAV ====== */
  .nav{
    position:sticky;top:0;z-index:50;background:rgba(255,255,255,.86);
    backdrop-filter:saturate(140%) blur(10px);
    border-bottom:1px solid transparent;
  }
  .nav.scrolled{border-bottom-color:var(--rule)}
  .nav-inner{max-width:var(--max);margin:0 auto;padding:28px 40px;display:flex;align-items:center;justify-content:space-between;gap:48px}
  .logo{
    position:relative;
    font-weight:800;letter-spacing:.18em;font-size:15px;color:var(--ink);
    padding-bottom:6px;
    cursor:pointer;user-select:none;
  }
  .logo::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--cyan);
    transform-origin:left center;
  }
  .nav-links{display:flex;align-items:center;gap:54px}
  .nav-links a{
    font-size:15px;color:var(--ink-2);font-weight:400;
    position:relative;padding:6px 0;transition:color .2s;
  }
  .nav-links a:hover{color:#000}
  .nav-links a::after{
    content:"";position:absolute;left:50%;right:50%;bottom:0;height:2px;background:var(--cyan);
    transition:left .25s,right .25s;
  }
  .nav-links a:hover::after{left:0;right:0}
  .nav-links a.nav-cta{
    color:var(--ink);font-weight:600;
    padding:8px 14px;border:1px solid var(--ink);border-radius:2px;
    transition:background .15s,color .15s;
  }
  .nav-links a.nav-cta:hover{background:var(--ink);color:#fff}
  .nav-links a.nav-cta::after{display:none}
  .nav-links a.nav-user{
    display:flex;align-items:center;gap:9px;
    color:var(--ink);font-weight:600;
    padding:5px 14px 5px 6px;border:1px solid var(--ink);border-radius:999px;
    transition:background .15s,color .15s;
  }
  .nav-links a.nav-user:hover{background:var(--ink);color:#fff}
  .nav-links a.nav-user::after{display:none}
  .nav-user-ava{
    width:26px;height:26px;border-radius:50%;object-fit:cover;
    background:var(--cyan);
  }
  .nav-user-initials{
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:800;letter-spacing:.04em;color:#000;
  }
  .nav-user-name{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ====== GLITCH TEXT ======
     Discrete, event-driven glitches: hard band slices + RGB tear.
     No continuous side-to-side jitter — bursts are short and snap.
     `isolation: isolate` keeps the blend context independent of parents —
     editor overlays / wrappers used to swallow the effect. */
  .glitch{position:relative;display:inline-block;line-height:inherit;isolation:isolate}
  .glitch .layer{position:relative;display:inline-block}
  .glitch .g-cyan,.glitch .g-mag{
    position:absolute;left:0;top:0;width:100%;
    pointer-events:none;
    opacity:0;
    clip-path:inset(0 0 100% 0);
  }
  /* Solid color layers — no blend mode required. Drop-shadow adds a glow halo
     so the slice still reads against light backgrounds. */
  .glitch .g-cyan{color:var(--cyan);filter:drop-shadow(0 0 1px rgba(0,229,209,.5));}
  .glitch .g-mag{color:var(--magenta);filter:drop-shadow(0 0 1px rgba(255,43,214,.5));}

  /* When .glitching is on, run a 0.45s sequence with discrete keyframes (steps).
     Each keyframe is a different band displacement — no smooth tween. */
  .glitch.glitching .g-cyan{animation:gtxCyan .45s steps(1,end) 1}
  .glitch.glitching .g-mag{animation:gtxMag .45s steps(1,end) 1}
  .glitch.glitching .layer.base{animation:gtxBase .45s steps(1,end) 1}

  @keyframes gtxCyan{
    0%   { opacity:1;   clip-path:inset(8%  0 70% 0); transform:translateX(-12px); }
    14%  { opacity:1;   clip-path:inset(55% 0 30% 0); transform:translateX(-18px); }
    28%  { opacity:.95; clip-path:inset(30% 0 50% 0); transform:translateX(-8px); }
    42%  { opacity:.95; clip-path:inset(78% 0 8%  0); transform:translateX(-14px); }
    56%  { opacity:.85; clip-path:inset(22% 0 60% 0); transform:translateX(-6px); }
    70%  { opacity:.75; clip-path:inset(45% 0 40% 0); transform:translateX(-10px); }
    100% { opacity:0;   clip-path:inset(0 0 100% 0); transform:translateX(0); }
  }
  @keyframes gtxMag{
    0%   { opacity:.95; clip-path:inset(45% 0 35% 0); transform:translateX(12px); }
    14%  { opacity:1;   clip-path:inset(15% 0 65% 0); transform:translateX(18px); }
    28%  { opacity:.9;  clip-path:inset(65% 0 18% 0); transform:translateX(7px); }
    42%  { opacity:.95; clip-path:inset(8%  0 78% 0); transform:translateX(14px); }
    56%  { opacity:.85; clip-path:inset(50% 0 30% 0); transform:translateX(9px); }
    70%  { opacity:.75; clip-path:inset(28% 0 55% 0); transform:translateX(11px); }
    100% { opacity:0;   clip-path:inset(0 0 100% 0); transform:translateX(0); }
  }
  /* Base layer: stays put except one or two hard band-slip moments */
  @keyframes gtxBase{
    0%, 27%   { clip-path:none; transform:translateX(0); }
    28%       { clip-path:inset(35% 0 45% 0); transform:translateX(8px); }
    34%       { clip-path:none; transform:translateX(0); }
    55%       { clip-path:inset(65% 0 15% 0); transform:translateX(-6px); }
    61%, 100% { clip-path:none; transform:translateX(0); }
  }

  /* Rotating word: same glitch system but ALWAYS layered, plus a scramble swap */
  .rot{position:relative;display:inline-block;color:var(--cyan-strong);font-weight:700;text-align:left;vertical-align:baseline;isolation:isolate}
  /* Spacer reserves layout space for the LONGEST phrase so shorter ones don't reflow */
  .rot .rot-spacer{display:inline-block;visibility:hidden;white-space:nowrap}
  .rot .layer{position:absolute;left:0;top:0;width:100%;display:inline-block;white-space:nowrap}
  .rot .r-cyan,.rot .r-mag{pointer-events:none;opacity:0;clip-path:inset(0 0 100% 0);}
  .rot .r-cyan{color:var(--cyan);filter:drop-shadow(0 0 1px rgba(0,229,209,.5));}
  .rot .r-mag{color:var(--magenta);filter:drop-shadow(0 0 1px rgba(255,43,214,.5));}
  .rot .r-cyan{color:var(--cyan)}
  .rot .r-mag{color:var(--magenta)}
  .rot.glitching .r-cyan{animation:gtxCyan .5s steps(1,end) 1}
  .rot.glitching .r-mag{animation:gtxMag .5s steps(1,end) 1}
  .rot.glitching .layer.base{animation:gtxBase .5s steps(1,end) 1}

  /* ====== HERO ====== */
  .hero{
    position:relative;
    min-height:calc(100vh - 88px);
    max-width:var(--max);margin:0 auto;
    padding:72px 40px 76px;
    display:grid;grid-template-columns:minmax(0,1.08fr) minmax(340px,.92fr);
    align-items:center;gap:64px;
  }
  .hero-copy{max-width:680px}
  .hero-eyebrow{
    margin:0 0 20px;color:var(--cyan-strong);
    font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  }
  .hero h1{
    margin:0;font-size:clamp(44px,5.6vw,74px);line-height:1.02;
    letter-spacing:-.045em;font-weight:700;color:var(--ink);
  }
  .hero-description{
    max-width:650px;margin:26px 0 0;color:var(--ink-2);
    font-size:18px;line-height:1.65;
  }
  .hero-note{
    max-width:620px;margin:18px 0 0;color:var(--muted);
    font-size:12.5px;line-height:1.55;
  }
  .hero-note a{
    color:var(--ink-2);font-weight:600;text-decoration:underline;
    text-decoration-color:var(--cyan-strong);text-underline-offset:3px;
  }
  .hero-visual{
    display:flex;min-width:0;flex-direction:column;align-items:center;
  }
  .hero-proof{
    width:100%;border:1px solid var(--ink);background:rgba(255,255,255,.94);
  }
  .proof-row{
    display:grid;grid-template-columns:120px 1fr;gap:20px;
    padding:16px 18px;border-bottom:1px solid var(--rule);
  }
  .proof-row:last-child{border-bottom:none}
  .proof-k{
    color:var(--muted);font-size:10px;line-height:1.5;
    letter-spacing:.14em;text-transform:uppercase;
  }
  .proof-v{font-size:13px;line-height:1.55;color:var(--ink-2)}
  .proof-v strong{color:var(--ink)}
  .proof-v a{
    text-decoration:underline;text-decoration-color:var(--cyan-strong);
    text-underline-offset:3px;
  }
  .proof-live{
    display:inline-flex;align-items:center;gap:7px;margin-right:12px;
  }
  .proof-live::before{
    content:"";width:6px;height:6px;border-radius:50%;background:var(--cyan-strong);
  }
  .cube-wrap{
    position:relative;width:100%;display:flex;justify-content:center;align-items:center;
    margin:0 0 -28px;
  }
  .cube-stage{
    position:relative;width:410px;max-width:74vw;
    aspect-ratio:1/1;
    display:flex;align-items:center;justify-content:center;
    isolation:isolate;
  }
  .cube-stack{position:relative;width:82%;aspect-ratio:1/1;
    animation:float 7s ease-in-out infinite;
    will-change:transform;
    isolation:isolate;
  }
  /* Cube has transparent bg; no mask. */
  .cube-stack img.cube{
    position:absolute;inset:0;width:100%;height:100%;display:block;
  }
  .cube-stack img.cube.cyan,
  .cube-stack img.cube.mag{
    mix-blend-mode:screen;
    opacity:0;
    transform:translate(0,0);
  }
  .cube-stack img.cube.cyan{filter:drop-shadow(0 0 0 var(--cyan));}
  .cube-stack img.cube.mag{filter:drop-shadow(0 0 0 var(--magenta));}

  /* Cube glitch event — hard discrete band slices, snap-stepped (no smooth shake). */
  .cube-stage.glitching .cube-main{animation:cubeMain .42s steps(1,end) 1}
  .cube-stage.glitching .cube-stack img.cube.cyan{animation:cubeC .42s steps(1,end) 1}
  .cube-stage.glitching .cube-stack img.cube.mag{animation:cubeM .42s steps(1,end) 1}
  @keyframes cubeMain{
    0%   { clip-path:inset(0 0 72% 0); transform:translateX(12px); }
    16%  { clip-path:inset(58% 0 22% 0); transform:translateX(-16px); }
    32%  { clip-path:none; transform:translateX(0); }
    48%  { clip-path:inset(36% 0 46% 0); transform:translateX(10px); }
    64%  { clip-path:none; transform:translateX(0); }
    80%  { clip-path:inset(80% 0 6% 0); transform:translateX(-8px); }
    100% { clip-path:none; transform:translateX(0); }
  }
  @keyframes cubeC{
    0%   { opacity:.7; clip-path:inset(10% 0 65% 0); transform:translateX(-20px); }
    16%  { opacity:.8; clip-path:inset(54% 0 26% 0); transform:translateX(-26px); }
    32%  { opacity:.6; clip-path:inset(30% 0 52% 0); transform:translateX(-14px); }
    48%  { opacity:.75; clip-path:inset(74% 0 12% 0); transform:translateX(-22px); }
    64%  { opacity:.55; clip-path:inset(20% 0 62% 0); transform:translateX(-12px); }
    80%, 100% { opacity:0; clip-path:inset(0 0 100% 0); transform:translateX(0); }
  }
  @keyframes cubeM{
    0%   { opacity:.65; clip-path:inset(46% 0 30% 0); transform:translateX(20px); }
    16%  { opacity:.75; clip-path:inset(18% 0 60% 0); transform:translateX(26px); }
    32%  { opacity:.6; clip-path:inset(60% 0 22% 0); transform:translateX(14px); }
    48%  { opacity:.7; clip-path:inset(8% 0 76% 0); transform:translateX(22px); }
    64%  { opacity:.5; clip-path:inset(48% 0 32% 0); transform:translateX(12px); }
    80%, 100% { opacity:0; clip-path:inset(0 0 100% 0); transform:translateX(0); }
  }
  @keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
  }
  /* Horizontal slice trails — band copies that fly sideways during a glitch event */
  .slice-trails{position:absolute;inset:-4% -22% -4% -22%;pointer-events:none;overflow:hidden;}
  .slice-trails .slice{
    position:absolute;left:50%;
    width:82%;aspect-ratio:1/1;
    background-image:url('assets/cube.png');
    background-size:contain;background-repeat:no-repeat;background-position:center;
    opacity:0;
    transform:translate(-50%,0);
    will-change:transform,opacity,clip-path,filter;
  }
  .cube-stage.glitching .slice.s1{ top:14%; animation:trailA .42s steps(1,end) 1; }
  .cube-stage.glitching .slice.s2{ top:14%; animation:trailB .42s steps(1,end) 1; }
  .cube-stage.glitching .slice.s3{ top:14%; animation:trailC .42s steps(1,end) 1; }
  .cube-stage.glitching .slice.s4{ top:14%; animation:trailD .42s steps(1,end) 1; }
  .cube-stage.glitching .slice.s5{ top:14%; animation:trailE .42s steps(1,end) 1; }
  @keyframes trailA{
    0%   { opacity:.9; clip-path:inset(18% 0 76% 0); transform:translate(calc(-50% - 70px),0); filter:drop-shadow(-8px 0 0 var(--cyan)); }
    33%  { opacity:.85; clip-path:inset(22% 0 72% 0); transform:translate(calc(-50% - 130px),0); filter:drop-shadow(-14px 0 0 var(--cyan)); }
    66%  { opacity:.55; clip-path:inset(18% 0 76% 0); transform:translate(calc(-50% - 200px),0); filter:drop-shadow(-6px 0 0 var(--cyan)); }
    100% { opacity:0; transform:translate(-50%,0); }
  }
  @keyframes trailB{
    0%   { opacity:.75; clip-path:inset(32% 0 60% 0); transform:translate(calc(-50% + 90px),0); filter:drop-shadow(10px 0 0 var(--magenta)); }
    33%  { opacity:.85; clip-path:inset(36% 0 56% 0); transform:translate(calc(-50% + 150px),0); filter:drop-shadow(16px 0 0 var(--magenta)); }
    66%  { opacity:.55; clip-path:inset(32% 0 60% 0); transform:translate(calc(-50% + 210px),0); filter:drop-shadow(8px 0 0 var(--magenta)); }
    100% { opacity:0; transform:translate(-50%,0); }
  }
  @keyframes trailC{
    0%   { opacity:.9; clip-path:inset(48% 0 46% 0); transform:translate(calc(-50% - 130px),0); filter:drop-shadow(-12px 0 0 var(--cyan)); }
    33%  { opacity:.95; clip-path:inset(52% 0 42% 0); transform:translate(calc(-50% - 200px),0); filter:drop-shadow(-18px 0 0 var(--cyan)); }
    66%  { opacity:.6; clip-path:inset(48% 0 46% 0); transform:translate(calc(-50% - 260px),0); filter:drop-shadow(-8px 0 0 var(--cyan)); }
    100% { opacity:0; transform:translate(-50%,0); }
  }
  @keyframes trailD{
    0%   { opacity:.7; clip-path:inset(62% 0 32% 0); transform:translate(calc(-50% + 70px),0); filter:drop-shadow(8px 0 0 var(--magenta)); }
    33%  { opacity:.8; clip-path:inset(66% 0 28% 0); transform:translate(calc(-50% + 130px),0); filter:drop-shadow(14px 0 0 var(--magenta)); }
    66%  { opacity:.5; clip-path:inset(62% 0 32% 0); transform:translate(calc(-50% + 190px),0); filter:drop-shadow(6px 0 0 var(--magenta)); }
    100% { opacity:0; transform:translate(-50%,0); }
  }
  @keyframes trailE{
    0%   { opacity:.85; clip-path:inset(78% 0 16% 0); transform:translate(calc(-50% - 60px),0); filter:drop-shadow(-6px 0 0 var(--cyan)); }
    33%  { opacity:.9; clip-path:inset(82% 0 12% 0); transform:translate(calc(-50% - 120px),0); filter:drop-shadow(-12px 0 0 var(--cyan)); }
    66%  { opacity:.55; clip-path:inset(78% 0 16% 0); transform:translate(calc(-50% - 170px),0); filter:drop-shadow(-4px 0 0 var(--cyan)); }
    100% { opacity:0; transform:translate(-50%,0); }
  }
  /* Scanline flash overlay — stepped, no continuous motion */
  .scanlines{
    position:absolute;inset:6% 14%;
    pointer-events:none;opacity:0;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0,
      rgba(0,0,0,0) 2px,
      rgba(0,229,209,.08) 3px,
      rgba(0,0,0,0) 4px
    );
    mix-blend-mode:multiply;
  }
  .cube-stage.glitching .scanlines{animation:scanFlash .42s steps(1,end) 1}
  @keyframes scanFlash{
    0%   { opacity:.85; transform:translateY(-5px); }
    25%  { opacity:.4; transform:translateY(4px); }
    50%  { opacity:.8; transform:translateY(-3px); }
    75%  { opacity:.5; transform:translateY(5px); }
    100% { opacity:0; transform:translateY(0); }
  }
  .cube-stage .shadow{
    position:absolute;left:50%;bottom:6%;transform:translateX(-50%);
    width:46%;height:30px;border-radius:50%;
    background:radial-gradient(closest-side, rgba(15,15,20,.18), rgba(15,15,20,0) 70%);
    filter:blur(6px);
    animation:shadowPulse 7s ease-in-out infinite;
    z-index:-1;
  }
  @keyframes shadowPulse{
    0%,100%{transform:translateX(-50%) scale(1);opacity:.9}
    50%{transform:translateX(-50%) scale(.9);opacity:.65}
  }

  .tagline{
    margin-top:46px;text-align:center;color:var(--ink-2);
    font-size:30px;line-height:1.35;font-weight:400;letter-spacing:-.005em;
    max-width:720px;
  }
  /* Partner projects strip directly under the hero logo */
  .hero-partners{
    display:flex;align-items:center;justify-content:center;gap:14px;
    margin-top:26px;flex-wrap:wrap;
  }
  .hero-partners .pk{
    font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.18em;
  }
  .hero-partners a.partner{
    display:inline-flex;align-items:center;gap:9px;
    padding:7px 14px;border:1px solid var(--rule);border-radius:999px;
    color:var(--ink);text-decoration:none;
    font-size:13px;font-weight:600;letter-spacing:.02em;
    transition:border-color .2s ease,color .2s ease;
  }
  .hero-partners a.partner img{
    width:20px;height:20px;border-radius:50%;object-fit:cover;display:block;
  }
  .hero-partners a.partner:hover{border-color:var(--cyan-strong);color:var(--cyan-strong)}
  .hero-ctas{
    display:flex;gap:12px;margin-top:32px;flex-wrap:wrap;justify-content:flex-start;
  }
  .hero-stats{
    margin-top:0;width:100%;max-width:none;
    display:grid;grid-template-columns:repeat(2,1fr);
    border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  }
  .hero-stats .stat{
    padding:24px 18px;text-align:center;
    border-right:1px solid var(--rule);
    display:flex;flex-direction:column;gap:6px;
  }
  .hero-stats .stat:last-child{border-right:none}
  .hero-stats .sv{
    font-size:24px;font-weight:700;letter-spacing:-.01em;color:var(--ink);
    font-feature-settings:"tnum";
  }
  .hero-stats .sk{
    font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;
  }

  /* Utility grid in the Token section */
  .util-grid{
    display:grid;grid-template-columns:repeat(3,1fr);
    border:1px solid var(--ink);
    margin:40px 0 8px;
  }
  .util{
    padding:24px 26px;
    border-right:1px solid var(--rule);
    border-bottom:1px solid var(--rule);
  }
  .util:nth-child(3n){border-right:none}
  .util:nth-last-child(-n+3){border-bottom:none}
  .util-k{
    font-size:11px;color:var(--cyan-strong);
    text-transform:uppercase;letter-spacing:.16em;font-weight:700;
    margin-bottom:8px;
  }
  .util-v{
    font-size:14.5px;line-height:1.55;color:var(--ink);font-weight:400;
  }

  /* ====== SECTION SHELL ====== */
  section{max-width:var(--max);margin:0 auto;padding:120px 40px}
  .eyebrow{
    text-align:center;color:var(--muted);font-size:14px;letter-spacing:.04em;
    font-weight:500;
  }
  .eyebrow .dash{display:inline-block;width:22px;height:1px;background:var(--muted);vertical-align:middle;margin:0 12px}

  .founding h1{
    margin:28px auto 28px;text-align:center;
    font-size:64px;line-height:1.08;letter-spacing:-.02em;font-weight:400;
    color:var(--ink);
    max-width:1000px;
  }
  .founding h1 .b1{display:block}
  .founding h1 .b2{display:block}
  .founding .lede{
    text-align:center;color:var(--ink-2);max-width:560px;margin:0 auto;
    font-size:16px;line-height:1.6;font-weight:400;
  }

  /* Subsection 1 */
  .chapter-index{
    display:flex;align-items:baseline;gap:36px;color:var(--ink-2);
    font-size:15px;font-weight:500;margin-bottom:64px;
    padding-left:6px;
  }
  .chapter-index .num{color:var(--muted);font-weight:500;width:18px}
  .chapter-h{
    font-size:38px;line-height:1.18;font-weight:700;letter-spacing:-.015em;
    color:var(--ink);margin:0 0 40px;max-width:760px;
  }
  .chapter-h .glitch{display:block}
  .body{max-width:760px}
  .body p{
    font-size:17px;line-height:1.6;color:var(--ink-2);font-weight:400;
    margin:0 0 22px;
  }
  .body p.small{font-size:13.5px;color:#3a3f44;line-height:1.65}
  .body p.lead{font-size:18px;color:var(--ink);font-weight:500}
  .quote{
    margin:48px 0 0;
    border:1px solid var(--cyan);
    padding:42px 56px;
    color:var(--ink);
    font-size:18px;line-height:1.55;font-weight:400;
    text-align:center;
    max-width:760px;
    position:relative;
  }
  .quote::before{
    content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:3px;background:var(--cyan);
    opacity:0;
  }

  /* ====== FOOTER / CHANNELS ====== */
  .footer{
    border-top:1px solid var(--rule);
    background:#fff;
  }
  .channels-inner{
    max-width:var(--max);margin:0 auto;padding:120px 40px 64px;
  }
  .channels-head{margin-bottom:64px}
  .ch-h{
    font-size:44px;line-height:1.1;letter-spacing:-.02em;font-weight:700;
    color:var(--ink);margin:18px 0 0;max-width:780px;
  }
  .channels-grid{
    display:grid;grid-template-columns:repeat(3,1fr);
    border:1px solid var(--ink);
  }
  .channel{
    display:flex;align-items:center;gap:18px;
    padding:24px 26px;
    border-right:1px solid var(--rule);
    border-bottom:1px solid var(--rule);
    text-decoration:none;color:var(--ink);
    position:relative;
    transition:background .15s,color .15s;
    min-height:88px;
  }
  .channel:hover{background:var(--ink);color:#fff}
  .channel:hover .ch-handle{color:rgba(255,255,255,.7)}
  .channel:hover .ch-icon{color:var(--cyan)}
  .channel:hover .ch-arr{transform:translate(2px,-2px)}
  /* Borders: 3 cols → kill right border on every 3rd; kill bottom on last row */
  .channel:nth-child(3n){border-right:none}
  .channel:nth-last-child(-n+2){border-bottom:none}
  .channel:nth-last-child(-n+2):nth-child(3n+1) ~ .channel{border-bottom:none}
  /* The 5-item layout: 3 + 2. Items 4-5 are last row. */
  .channels-grid > .channel:nth-child(4),
  .channels-grid > .channel:nth-child(5){border-bottom:none}
  .ch-icon{
    width:38px;height:38px;flex:0 0 38px;
    display:inline-flex;align-items:center;justify-content:center;
    color:var(--ink-2);
    transition:color .15s;
  }
  .ch-icon svg{width:22px;height:22px}
  .ch-meta{flex:1 1 auto;min-width:0}
  .ch-label{
    font-size:12px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);margin-bottom:4px;
  }
  .channel:hover .ch-label{color:rgba(255,255,255,.55)}
  .ch-handle{
    font-size:16px;font-weight:500;color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    transition:color .15s;
  }
  .ch-arr{
    flex:0 0 auto;color:inherit;opacity:.5;
    transition:transform .15s,opacity .15s;
  }
  .channel:hover .ch-arr{opacity:1}

  .channels-foot{
    display:flex;align-items:baseline;justify-content:space-between;gap:24px;
    margin-top:48px;padding-top:28px;
    border-top:1px solid var(--rule);
  }
  .logo-mark{
    font-weight:800;letter-spacing:.18em;font-size:14px;
  }
  .colophon{font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center}
  .colophon .sep{opacity:.4}

  @media (max-width:880px){
    .channels-inner{padding:80px 22px 48px}
    .ch-h{font-size:28px}
    .channels-grid{grid-template-columns:1fr}
    .channel{border-right:none !important;border-bottom:1px solid var(--rule) !important}
    .channels-grid > .channel:last-child{border-bottom:none !important}
    .channels-foot{flex-direction:column;align-items:flex-start;gap:14px}
  }

  /* ====== NETWORK / RITE SECTION ====== */
  .rite{
    border-top:1px solid var(--rule);
    border-bottom:1px solid var(--rule);
    background:
      radial-gradient(circle at 12% 0%, rgba(0,229,209,.07), transparent 40%),
      radial-gradient(circle at 88% 100%, rgba(255,43,214,.05), transparent 42%),
      #fff;
  }
  .rite-inner{max-width:var(--max);margin:0 auto;padding:120px 40px}
  .rite h2{
    font-size:44px;line-height:1.1;letter-spacing:-.02em;font-weight:700;
    color:var(--ink);margin:18px 0 28px;max-width:780px;
  }
  .rite .lede{max-width:680px;color:var(--ink-2);font-size:17px;line-height:1.6;margin-bottom:56px}
  .params{
    border:1px solid var(--ink);
    background:#fff;
    display:grid;grid-template-columns:1fr 1fr;
  }
  .param{
    padding:24px 28px;
    border-right:1px solid var(--rule);
    border-bottom:1px solid var(--rule);
    display:flex;flex-direction:column;gap:8px;
    position:relative;
  }
  .param:nth-child(2n){border-right:none}
  .param:nth-last-child(-n+2){border-bottom:none}
  .param .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
  .param .v{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:17px;color:var(--ink);font-weight:500;
    word-break:break-all;
    padding-right:48px;
  }
  .param .copy{
    position:absolute;top:18px;right:16px;
    width:32px;height:32px;border-radius:4px;
    border:1px solid var(--rule);background:#fff;
    display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--muted);
    transition:border-color .15s,color .15s,background .15s;
  }
  .param .copy:hover{border-color:var(--ink);color:var(--ink)}
  .param .copy.ok{border-color:var(--cyan);background:var(--cyan);color:#000}
  .param .copy svg{width:14px;height:14px}
  .rite-actions{display:flex;gap:14px;margin-top:36px;flex-wrap:wrap}
  .btn{
    display:inline-flex;align-items:center;gap:10px;
    padding:16px 22px;font:inherit;font-size:14.5px;font-weight:600;
    border-radius:2px;cursor:pointer;letter-spacing:.01em;
    border:1px solid var(--ink);background:var(--ink);color:#fff;
    transition:background .15s,color .15s,transform .05s;
  }
  .btn:hover{background:#000}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:transparent;color:var(--ink)}
  .btn.ghost:hover{background:var(--ink);color:#fff}
  .btn .arr{transition:transform .15s}
  .btn:hover .arr{transform:translateX(3px)}

  /* The pump.fun buy button — primary CTA, visually loud */
  .btn-buy{
    background:linear-gradient(180deg,#0f0f10 0%,#000 100%);
    color:#fff;border:1px solid #000;
    padding:18px 24px;
    box-shadow: 0 0 0 1px rgba(0,229,209,.0), 0 8px 28px rgba(0,229,209,.18);
    position:relative;
    overflow:hidden;
  }
  .btn-buy::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
    background:linear-gradient(180deg,var(--cyan),var(--magenta));
  }
  .btn-buy:hover{
    background:linear-gradient(180deg,#0f0f10 0%,#000 100%);
    box-shadow: 0 0 0 1px rgba(0,229,209,.5), 0 10px 36px rgba(0,229,209,.32);
  }
  .btn-buy-pre{opacity:.75;font-weight:500;margin-right:2px}
  .btn-buy-tick{
    font-weight:800;letter-spacing:.01em;
    background:linear-gradient(90deg,var(--cyan),#fff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .btn-buy-chain{
    opacity:.6;font-weight:500;font-size:13px;margin-left:6px;
    border-left:1px solid rgba(255,255,255,.2);padding-left:10px;
  }

  /* Token contract card — bottom of the thesis section */
  .token-card{
    margin-top:48px;border:1px solid var(--ink);background:#fff;
    display:grid;grid-template-columns:auto 1fr auto;gap:0;
    align-items:stretch;
  }
  .tc-head{
    padding:22px 26px;border-right:1px solid var(--rule);
    display:flex;flex-direction:column;gap:4px;justify-content:center;
    min-width:220px;
  }
  .tc-tick{font-size:22px;font-weight:800;letter-spacing:.01em;color:var(--ink)}
  .tc-chain{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
  .tc-ca{
    padding:22px 26px;border-right:1px solid var(--rule);
    display:flex;flex-direction:column;gap:6px;justify-content:center;
    position:relative;min-width:0;
  }
  .tc-k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
  .tc-v{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:14.5px;color:var(--ink);word-break:break-all;padding-right:44px;
  }
  .tc-ca .copy{position:absolute;top:18px;right:16px}
  .tc-actions{
    display:flex;align-items:center;padding:14px 16px;
  }
  .tc-actions .btn-buy{margin:0}

  @media (max-width: 880px){
    .token-card{grid-template-columns:1fr}
    .tc-head,.tc-ca{border-right:none;border-bottom:1px solid var(--rule)}
    .tc-actions{padding:18px;justify-content:stretch}
    .tc-actions .btn-buy{flex:1;justify-content:center}
  }
  .toast{
    margin-top:18px;
    font-size:14px;color:var(--cyan-strong);
    opacity:0;transform:translateY(-4px);
    transition:opacity .2s,transform .2s;
  }
  .toast.show{opacity:1;transform:translateY(0)}

  /* ====== DOCTRINE LIST ====== */
  .creed{
    display:grid;grid-template-columns:repeat(3,1fr);gap:0;
    border-top:1px solid var(--rule);
    margin-top:64px;
  }
  .creed .tenet{
    border-right:1px solid var(--rule);
    padding:36px 32px 40px;
  }
  .creed .tenet:last-child{border-right:none}
  .creed .tenet .num{
    font-family:ui-monospace,monospace;font-size:12px;color:var(--cyan-strong);
    letter-spacing:.18em;margin-bottom:18px;
  }
  .creed .tenet h3{
    font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0 0 12px;color:var(--ink);
    line-height:1.25;
  }
  .creed .tenet p{font-size:14.5px;line-height:1.55;color:var(--ink-2);margin:0}
  .creed .tenet ul{list-style:none;margin:0;padding:0}
  .creed .tenet li{
    font-size:14.5px;line-height:1.5;color:var(--ink-2);
    padding:9px 0 9px 20px;position:relative;
    border-bottom:1px solid var(--rule);
  }
  .creed .tenet li:last-child{border-bottom:none}
  .creed .tenet li::before{content:"—";position:absolute;left:0;color:var(--cyan-strong)}

  /* ====== PHILOSOPHY PILLARS ====== */
  .pillars{
    display:grid;grid-template-columns:1fr 1fr;
    border:1px solid var(--ink);margin-top:64px;
  }
  .pillar{
    padding:30px 32px;
    border-right:1px solid var(--rule);
    border-bottom:1px solid var(--rule);
  }
  .pillar:nth-child(2n){border-right:none}
  .pillar:nth-last-child(-n+2){border-bottom:none}
  .pillar .num{
    font-family:ui-monospace,monospace;font-size:12px;color:var(--cyan-strong);
    letter-spacing:.18em;margin-bottom:14px;
  }
  .pillar h3{
    font-size:19px;font-weight:700;letter-spacing:-.01em;
    margin:0 0 10px;color:var(--ink);line-height:1.25;
  }
  .pillar p{font-size:14.5px;line-height:1.55;color:var(--ink-2);margin:0}

  /* ====== PHILOSOPHY — DARK BAND ====== */
  .phil{
    max-width:none;padding:0;position:relative;color:#eceff1;
    background:
      radial-gradient(1000px 460px at 88% -5%, rgba(0,229,209,.10), transparent 60%),
      radial-gradient(800px 420px at 4% 105%, rgba(255,43,214,.07), transparent 60%),
      #0b0d0f;
  }
  .phil::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,.028) 0 1px, transparent 1px 4px);
  }
  .phil::after{
    content:"";position:absolute;left:0;right:0;top:0;height:2px;
    background:linear-gradient(90deg, var(--cyan), rgba(0,229,209,0) 65%);
  }
  .phil-inner{max-width:var(--max);margin:0 auto;padding:130px 40px;position:relative}
  .phil .chapter-index{color:rgba(255,255,255,.6)}
  .phil .chapter-index .num{color:var(--cyan)}
  .phil .chapter-h{font-size:52px;max-width:880px;color:#fff}
  .phil .body p{color:rgba(255,255,255,.7)}
  .phil .body p.lead{color:#fff}
  .phil .body strong{color:var(--cyan);font-weight:600}
  .phil .creed{border-top-color:rgba(255,255,255,.18)}
  .phil .creed .tenet{border-right-color:rgba(255,255,255,.1)}
  .phil .creed .tenet h3{color:#fff}
  .phil .creed .tenet p{color:rgba(255,255,255,.66)}
  .phil .creed .tenet .num{color:var(--cyan)}
  .phil .pillars{border-color:rgba(255,255,255,.4)}
  .phil .pillar{border-right-color:rgba(255,255,255,.1);border-bottom-color:rgba(255,255,255,.1)}
  .phil .pillar h3{color:#fff}
  .phil .pillar p{color:rgba(255,255,255,.66)}
  .phil .pillar .num{color:var(--cyan)}
  .phil .btn.ghost{border-color:rgba(255,255,255,.9);color:#fff}
  .phil .btn.ghost:hover{background:#fff;color:var(--ink)}

  /* ====== TOKENISED STOCKS ====== */
  /* Live prices on a static page: the grid renders from a list that ships in
     the markup, and the numbers arrive over it. A failed fetch therefore costs
     the prices and never the section. */
  .stx{max-width:var(--max);margin:0 auto;padding:96px 28px 20px}
  .stx-grid{
    display:grid;grid-template-columns:repeat(6,1fr);
    border:1px solid var(--ink);margin-top:28px;
  }
  .stx-cell{
    display:flex;flex-direction:column;gap:8px;
    padding:16px 16px 14px;
    border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);
    color:var(--ink);text-decoration:none;
    transition:background .15s,color .15s;
  }
  .stx-cell:nth-child(6n){border-right:none}
  .stx-cell:nth-last-child(-n+6){border-bottom:none}
  a.stx-cell:hover{background:var(--ink);color:#fff}
  a.stx-cell:hover .stx-name,a.stx-cell:hover .stx-day{color:rgba(255,255,255,.6)}
  a.stx-cell:hover .stx-bar{background:rgba(255,255,255,.25)}
  .stx-top{display:flex;align-items:center;gap:9px}
  .stx-logo{
    width:24px;height:24px;flex:0 0 24px;border-radius:3px;
    background:#fff;object-fit:contain;padding:1px;
    border:1px solid var(--rule);
  }
  .stx-tick{font-weight:800;font-size:13px;letter-spacing:.02em}
  .stx-name{
    font-size:10px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .stx-px{font-variant-numeric:tabular-nums;font-weight:700;font-size:16px}
  .stx-day{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
  .stx-bar{position:relative;height:2px;background:var(--rule)}
  .stx-at{position:absolute;top:-2px;width:2px;height:6px;background:currentColor;transform:translateX(-1px)}
  .stx-note{margin-top:18px;font-size:12px;color:var(--muted);max-width:760px;line-height:1.7}
  .stx-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
  @media(max-width:1080px){
    .stx-grid{grid-template-columns:repeat(4,1fr)}
    .stx-cell:nth-child(6n){border-right:1px solid var(--rule)}
    .stx-cell:nth-child(4n){border-right:none}
    .stx-cell:nth-last-child(-n+6){border-bottom:1px solid var(--rule)}
    .stx-cell:nth-last-child(-n+4){border-bottom:none}
  }
  @media(max-width:640px){
    .stx{padding:64px 22px 16px}
    .stx-grid{grid-template-columns:repeat(2,1fr)}
    .stx-cell:nth-child(4n){border-right:1px solid var(--rule)}
    .stx-cell:nth-child(2n){border-right:none}
    .stx-cell:nth-last-child(-n+4){border-bottom:1px solid var(--rule)}
    .stx-cell:nth-last-child(-n+2){border-bottom:none}
  }

  /* ====== ECOSYSTEM ====== */
  .eco-sub{
    display:flex;align-items:center;gap:16px;
    margin:72px 0 20px;
    font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);font-weight:700;
  }
  .eco-sub::after{content:"";flex:1;height:1px;background:var(--rule)}
  .eco-sub:first-of-type{margin-top:56px}
  .prod-grid{
    display:grid;grid-template-columns:repeat(3,1fr);
    border:1px solid var(--ink);
  }
  .prod{
    display:flex;flex-direction:column;gap:10px;
    padding:26px 28px 22px;min-height:190px;
    border-right:1px solid var(--rule);
    border-bottom:1px solid var(--rule);
    color:var(--ink);text-decoration:none;
    transition:background .15s,color .15s;
  }
  .prod:nth-child(3n){border-right:none}
  .prod:nth-last-child(-n+3){border-bottom:none}
  a.prod:hover{background:var(--ink);color:#fff}
  .prod-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
  .prod-ic{
    width:42px;height:42px;flex:0 0 42px;
    display:inline-flex;align-items:center;justify-content:center;
    border:1px solid var(--rule);border-radius:3px;color:var(--ink);
    transition:border-color .15s,color .15s,box-shadow .15s;
  }
  .prod-ic svg{width:21px;height:21px}
  a.prod:hover .prod-ic{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 20px rgba(0,229,209,.35)}
  .prod.soon .prod-ic{color:var(--muted)}
  .prod.soon{cursor:default}
  .prod-k{
    font-size:11px;color:var(--cyan-strong);
    text-transform:uppercase;letter-spacing:.16em;font-weight:700;
    text-align:right;
  }
  a.prod:hover .prod-k{color:var(--cyan)}
  .prod h3{
    font-size:20px;font-weight:700;letter-spacing:-.01em;
    margin:0;line-height:1.2;
  }
  .prod p{font-size:14px;line-height:1.55;color:var(--ink-2);margin:0;flex:1}
  a.prod:hover p{color:rgba(255,255,255,.75)}
  .prod-foot{
    display:flex;align-items:center;justify-content:space-between;margin-top:8px;
  }
  .prod-status{
    font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;
    padding:4px 9px;border:1px solid currentColor;border-radius:2px;
  }
  .prod-status.live{color:var(--cyan-strong);display:inline-flex;align-items:center;gap:7px}
  .prod-status.live::before{
    content:"";width:6px;height:6px;border-radius:50%;background:currentColor;
    animation:chipBlink 1.8s ease-in-out infinite;
  }
  @keyframes chipBlink{0%,100%{opacity:1}50%{opacity:.2}}
  a.prod:hover .prod-status.live{color:var(--cyan)}
  .prod-status.running{color:var(--ink)}
  a.prod:hover .prod-status.running{color:#fff}
  .prod-status.dev{color:var(--muted)}
  .prod-arr{opacity:.45;transition:transform .15s,opacity .15s}
  a.prod:hover .prod-arr{opacity:1;transform:translate(2px,-2px)}

  /* ====== TICKER TAPE ====== */
  .tape{
    overflow:hidden;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
    padding:13px 0;background:#fff;
  }
  .tape-track{
    display:inline-flex;white-space:nowrap;width:max-content;
    animation:tapeMove 44s linear infinite;
  }
  .tape.rev .tape-track{animation-direction:reverse}
  .tape span{

/* Funnel: share the app's session id and safe UTM attribution so a visitor who
   continues into /bridge or /swap stays in one acquisition session. */
const STATIC_ATTRIBUTION_KEY = 'site.utm_attribution';
function staticAttribution(){
  try{
    const stored = sessionStorage.getItem(STATIC_ATTRIBUTION_KEY);
    const attribution = stored ? JSON.parse(stored) : {};
    const params = new URLSearchParams(window.location.search);
    const fields = { utm_source:'source', utm_medium:'medium', utm_campaign:'campaign' };
    Object.entries(fields).forEach(([queryKey, metadataKey])=>{
      const value = (params.get(queryKey) || '').trim().slice(0,100);
      if(value) attribution[metadataKey] = value;
    });
    sessionStorage.setItem(STATIC_ATTRIBUTION_KEY, JSON.stringify(attribution));
    return attribution;
  }catch(e){
    return {};
  }
}
function trackStatic(event, metadata={}){
  try{
    let sid = localStorage.getItem('site.session_id');
    if(!sid){ sid = crypto.randomUUID(); localStorage.setItem('site.session_id', sid); }
    const merged = { ...staticAttribution(), ...metadata };
    const safe = {};
    ['source','medium','campaign','partner','network','token','action_type'].forEach(key=>{
      const value = typeof merged[key] === 'string' ? merged[key].trim().slice(0,100) : '';
      if(value) safe[key] = value;
    });
    fetch('/api/events', {
      method:'POST',
      keepalive:true,
      headers:{ 'Content-Type':'application/json', Accept:'application/json' },
      credentials:'same-origin',
      body: JSON.stringify({
        session_id: sid,
        event,
        page: window.location.pathname,
        metadata: safe,
      }),
    }).catch(()=>{});
  }catch(e){ /* analytics must never break the page */ }
}

/* ------------ Glitch text utilities ------------ */
// Drives a discrete glitch event by toggling a .glitching class on/off.
// One CSS keyframe sequence runs per event, with hard stepped frames.
function Glitch({ children, mode='auto', className='', minGap=2200, maxGap=4200 }){
  const [glitching, setGlitching] = useState(false);
  useEffect(()=>{
    if(mode!=='auto') return;
    let alive=true;
    let t1, t2;
    const fire = ()=>{
      if(!alive) return;
      setGlitching(true);
      t1 = setTimeout(()=> alive && setGlitching(false), 470);
      // 30% chance of a quick follow-up burst, otherwise a long pause
      const gap = Math.random() < .25 ? 280 : (minGap + Math.random()*(maxGap-minGap));
      t2 = setTimeout(fire, gap);
    };
    t1 = setTimeout(fire, 800 + Math.random()*1800);
    return ()=>{ alive=false; clearTimeout(t1); clearTimeout(t2); };
  }, [mode, minGap, maxGap]);
  return (
    <span className={`glitch ${glitching?'glitching':''} ${className}`}>
      <span className="layer g-mag" aria-hidden="true">{children}</span>
      <span className="layer g-cyan" aria-hidden="true">{children}</span>
      <span className="layer base">{children}</span>
    </span>
  );
}

// Rotating word — cycles through phrases with a scramble + hard band glitch
function GlitchRotator({ words, interval=2800 }){
  const [i, setI] = useState(0);
  const [glitching, setGlitching] = useState(false);
  const [scrambled, setScrambled] = useState(null);
  useEffect(()=>{
    let alive = true;
    let scramTimer;
    const t = setTimeout(()=>{
      if(!alive) return;
      setGlitching(true);
      const target = words[(i+1) % words.length];
      const chars = "abcdefghijklmnopqrstuvwxyz0123456789#%&@<>/\\";
      let frame = 0;
      scramTimer = setInterval(()=>{
        if(!alive) return;
        frame++;
        const s = target.split('').map(c => c===' ' ? ' ' : chars[Math.floor(Math.random()*chars.length)]).join('');
        setScrambled(s);
        if(frame >= 3){
          clearInterval(scramTimer);
          setScrambled(null);
          setI(prev => (prev+1) % words.length);
        }
      }, 70);
      setTimeout(()=>{ if(alive) setGlitching(false); }, 480);
    }, interval);
    return ()=>{ alive=false; clearTimeout(t); clearInterval(scramTimer); };
  }, [i]);
  const text = scrambled ?? words[i];
  // Find the longest phrase to reserve layout space — prevents reflow when shorter
  // phrases shrink the line and push following content up/down.
  const longest = useMemo(() =>
    words.reduce((a, b) => b.length > a.length ? b : a, ''), [words]);
  return (
    <span className={`rot ${glitching?'glitching':''}`}>
      {/* Invisible spacer sized to the longest phrase */}
      <span className="rot-spacer" aria-hidden="true">{longest}</span>
      <span className="layer r-mag" aria-hidden="true">{text}</span>
      <span className="layer r-cyan" aria-hidden="true">{text}</span>
      <span className="layer base">{text}</span>
    </span>
  );
}

      // schedule next glitch — quick bursts most of the time, occasional pauses
      const gap = Math.random() < .35 ? 800 + Math.random()*600 : 2400 + Math.random()*2200;
      setTimeout(loop, gap);
    };

/* ------------ Live block height (proof the chain is alive) ------------ */
function LiveBlock(){
  const [block, setBlock] = useState(null);
  const [flash, setFlash] = useState(false);
  const [failed, setFailed] = useState(false);
  useEffect(()=>{
    let alive = true, timer;
    const tick = ()=>{
      fetch(NETWORK.rpc, {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ jsonrpc:'2.0', id:1, method:'eth_blockNumber', params:[] }),
      })
        .then(r => r.json())
        .then(j => {
          if(!alive || !j || !j.result) return;
          const n = parseInt(j.result, 16);
          setFailed(false);
          setBlock(prev => {
            if(prev !== null && n !== prev){
              setFlash(true);
              setTimeout(()=>{ if(alive) setFlash(false); }, 450);
            }
            return n;
          });
        })
        .catch(()=>{ if(alive) setFailed(true); })
        .finally(()=>{ if(alive) timer = setTimeout(tick, 4000); });
    };
    tick();
    return ()=>{ alive = false; clearTimeout(timer); };
  },[]);
  if(block === null){
    return (
      <div className="stat">
        <div className="sv">{failed ? '—' : '…'}</div>
        <div className="sk">{failed ? 'Cyberia RPC unavailable' : 'Loading Cyberia block'}</div>
      </div>
    );
  }
  return (
    <div className="stat">
      <div className={`sv live-block ${flash?'flash':''}`}>
        <span className="pulse" aria-hidden="true"></span>
        {block.toLocaleString('en-US')}
      </div>
      <div className="sk">Live block · ~1s chain</div>
    </div>
  );
}

/* ------------ Top yield (live /api/dex/apr snapshot) ------------ */
/* Farm APY headlines when farms are emitting (that's where the 4-digit
   numbers live); pool fee APR is the fallback, the static trading-venue
   stat the last resort before the first snapshot lands. */
function AprStat(){
  const [stat, setStat] = useState(null);
  useEffect(()=>{
    let alive = true;
    const best = (rows, key) => {
      const values = (rows || [])
        .map(r => r[key])
        .filter(v => typeof v === 'number' && isFinite(v) && v > 0);
      return values.length ? Math.max(...values) : null;
    };
    fetch('/api/dex/apr', { headers:{ Accept:'application/json' } })
      .then(r => r.ok ? r.json() : null)
      .then(j => {
        if(!alive) return;
        if(!j){
          setStat({ empty: true });
          return;
        }
        const farmApy = best(j.farms, 'apy');
        const poolApr = best(j.pools, 'apr');
        if(farmApy !== null){
          setStat({ value: farmApy, sk: 'Top Farm APY · live rewards', href: '/farm' });
        } else if(poolApr !== null){
          setStat({ value: poolApr, sk: 'Top LP APR · real 24h fees', href: '/liquidity' });
        } else {
          setStat({ empty: true });
        }
      })
      .catch(()=>{ if(alive) setStat({ error: true }); });
    return ()=>{ alive = false; };
  },[]);
  if(stat === null){
    return (
      <div className="stat">
        <div className="sv">…</div>
        <div className="sk">Loading yield snapshot</div>
      </div>
    );
  }
  if(stat.error || stat.empty){
    return (
      <div className="stat">
        <div className="sv">—</div>
        <div className="sk">{stat.error ? 'Yield API unavailable' : 'No active yield snapshot'}</div>
      </div>
    );
  }
  const label = stat.value >= 1000
    ? Math.round(stat.value).toLocaleString('en-US')
    : stat.value.toFixed(1);
  return (
    <a className="stat" href={stat.href}>
      <div className="sv apr-value">{label}%</div>
      <div className="sk">{stat.sk}</div>
    </a>
  );
}

// Multi-wallet disambiguation. When MetaMask AND Phantom are both installed,
// they fight over window.ethereum and the loser silently hijacks it — so a
// "MetaMask" click can pop up Phantom. EIP-6963 lets each wallet announce
// itself by a stable rdns, so we can pick the one the user actually wants.
const _eip6963 = {};
window.addEventListener('eip6963:announceProvider', (e)=>{
  const d = e.detail;
  if(d && d.info && d.info.rdns){ _eip6963[d.info.rdns] = d.provider; }
});
window.dispatchEvent(new Event('eip6963:requestProvider'));

function getMetaMaskProvider(){
  window.dispatchEvent(new Event('eip6963:requestProvider'));
  if(_eip6963['io.metamask']) return _eip6963['io.metamask'];
  const eth = window.ethereum;
  if(!eth) return null;
  // Legacy: real MetaMask sets isMetaMask and is not Phantom in disguise.
  if(Array.isArray(eth.providers)){
    return eth.providers.find(p => p && p.isMetaMask && !p.isPhantom) || null;
  }
  return (eth.isMetaMask && !eth.isPhantom) ? eth : null;
}

function ProdCard({ p }){

    <>
      <div className="prod-top">
        <span className="prod-ic" aria-hidden="true">{ICONS[p.ic]}</span>
        <span className="prod-k">{p.k}</span>
      </div>
      <h3>{p.name}</h3>
      <p>{p.desc}</p>
      <div className="prod-foot">
        <span className={`prod-status ${p.status}`}>{STATUS_LABEL[p.status]}</span>
        {p.href && (
          <svg className="prod-arr" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M7 17L17 7M9 7h8v8"/></svg>
        )}
      </div>
    </>
  );
  if(!p.href){
    return <div className="prod soon" data-reveal="">{inner}</div>;
  }
  const ext = p.href.startsWith('http');
  const extProps = ext ? { target:'_blank', rel:'noopener' } : {};
  return (
    <a className="prod" data-reveal="" href={p.href} {...extProps}>{inner}</a>
  );
}

/* ====== TOKENISED STOCKS ======
   Twelve of the fifty-three the wallet lists, with the price the issuer quotes
   for the underlying share. The tickers ship in this file so the section is
   never empty; the numbers are fetched once from /api/wallet/stocks, which is
   cached on the server — a page that asked Robinhood directly would spend a
   per-caller rate limit once per visitor. */
const STOCK_TICKERS = ['NVDA','TSLA','AAPL','SPCX','MSFT','GOOGL','AMZN','META','COIN','MSTR','SPY','GLD'];

function stockUrl(row){
  return row ? `/swap?chain=4663&out=${row.address}` : '/wallet';
}

function money(v){
  return v === null || v === undefined
    ? '—'
    : '$' + Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function Stocks(){
  const [rows, setRows] = useState(null);

  useEffect(()=>{
    let live = true;
    fetch('/api/wallet/stocks', { headers:{ Accept:'application/json' } })
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(body => {
        if(!live) return;
        const by = {};
        (body.stocks || []).forEach(row => { by[row.symbol] = row; });
        setRows(by);
      })
      .catch(()=>{ /* the grid keeps its tickers and shows no prices */ });
    return ()=>{ live = false; };
  },[]);

  return (
    <section className="stx" id="stocks" data-screen-label="03b Stocks">
      <div className="chapter-index">
        <span className="num">◆</span>
        <span>Equities — the market that already exists</span>
      </div>
      <h2 className="chapter-h" data-reveal="">
        <Glitch>Real stocks.</Glitch>
        <Glitch>Traded on chain.</Glitch>
      </h2>
      <div className="body" data-reveal="">
        <p className="lead">
          Robinhood tokenised the shares; the wallet holds them, the DEX trades
          them, and the same seed phrase that holds your CYBER holds NVIDIA.
          Fifty-three companies and funds, priced by the issuer and swapped in
          the pools of Robinhood Chain — no brokerage account anywhere in it.
        </p>
      </div>

      <div className="stx-grid" data-reveal="" aria-label="Tokenised stocks">
        {STOCK_TICKERS.map(sym => {
          const row = rows ? rows[sym] : null;
          const low = row && row.low, high = row && row.high, share = row && row.share;
          const at = (low !== null && high !== null && share !== null && high > low)
            ? Math.min(1, Math.max(0, (share - low) / (high - low)))
            : null;

          return (
            <a className="stx-cell" key={sym} href={stockUrl(row)}
               onClick={()=>trackStatic('stock_cta_clicked',{ticker:sym, action_type:'swap'})}>
              <span className="stx-top">
                {/* The path comes back with the row: eight of these logos are
                    PNGs and the rest SVGs, so the extension is not something a
                    ticker can be turned into. */}
                {row && row.icon ? <img className="stx-logo" src={row.icon} alt="" loading="lazy"/> : <span className="stx-logo"/>}
                <span className="stx-tick">{sym}</span>
              </span>
              <span className="stx-name">{row ? row.name : '\u00a0'}</span>
              <span className="stx-px">{money(row && row.price)}</span>
              {at === null
                ? <span className="stx-day">{'\u00a0'}</span>
                : <>
                    <span className="stx-bar"><span className="stx-at" style={{left:`${at*100}%`}}/></span>
                    <span className="stx-day">{money(low)} – {money(high)}</span>
                  </>}
            </a>
          );
        })}
      </div>

      <p className="stx-note">
        A share held by a broker, with a token standing for it on Robinhood
        Chain. It is not equity — no vote, no claim on the company — and here
        the only thing behind it is whoever will trade it in that chain’s pools.
        Prices are the issuer’s quote for the underlying share; what a trade
        actually pays is quoted live, against the pool, before you sign.
      </p>

      <div className="stx-cta">
        <a className="btn" href="/swap?chain=4663"
           onClick={()=>trackStatic('stock_cta_clicked',{action_type:'dex'})}>Trade on the DEX</a>
        <a className="btn ghost" href="/wallet"
           onClick={()=>trackStatic('stock_cta_clicked',{action_type:'wallet'})}>All 53 in the wallet</a>
      </div>
    </section>
  );
}

function App(){
  // Scroll-reveal: elements tagged data-reveal slide in when they enter view.
  useEffect(()=>{
    const els = Array.from(document.querySelectorAll('[data-reveal]'));
    if(!('IntersectionObserver' in window)){
      els.forEach(el => el.classList.add('revealed'));
      return;
    }
    const io = new IntersectionObserver((entries)=>{
      entries.forEach(en=>{
        if(en.isIntersecting){
          en.target.classList.add('revealed');
          io.unobserve(en.target);
        }
      });
    }, { rootMargin:'0px 0px -8% 0px', threshold:0.08 });
    els.forEach(el => io.observe(el));
    return ()=> io.disconnect();
  },[]);
  return (
    <>
      <Nav />
      <Hero />
      <Tape />
      <Philosophy />
      <Ecosystem />
      <Stocks />
      <Tape reverse />
      <Doctrine />
      <Problem />
      <Rite />
      <Contact />
    </>
  );
}
